<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinh nhật Lan Uyên</title>
<meta name="description" content="Một món quà nhỏ dành cho Lan Uyên">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05030f; --ink:#fff7fb; color-scheme:dark; --pink:#ff7eb6; --gold:#ffd27a; --violet:#9b7bff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#space{z-index:0}
#fx{z-index:5;pointer-events:none}
.scene{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;text-align:center;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.scene.show{opacity:1;visibility:visible;transition:opacity .9s ease}
#flash{position:fixed;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash 1.1s ease}
@keyframes flash{0%{opacity:0}30%{opacity:.95}100%{opacity:0}}

/* Màn mở đầu */
#start .title{font-family:"Dancing Script",cursive;font-size:clamp(34px,9vw,64px);color:var(--gold);
  text-shadow:0 0 24px rgba(255,210,122,.5)}
#start p{margin-top:14px;opacity:.8;font-weight:300}
.btn{margin-top:28px;padding:14px 30px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
  background:linear-gradient(135deg,rgba(255,126,182,.35),rgba(155,123,255,.35));color:#fff;font:600 16px "Be Vietnam Pro";
  backdrop-filter:blur(6px);cursor:pointer;box-shadow:0 0 30px rgba(255,126,182,.35);animation:pulse 2s infinite}
.btn.ghost{animation:none;background:rgba(255,255,255,.08);font-weight:400;font-size:14px;padding:10px 20px;margin-top:14px}
@keyframes pulse{50%{box-shadow:0 0 50px rgba(255,126,182,.7);transform:scale(1.04)}}

/* Cảnh 1: dãy số xoay */
#reelWrap{perspective:900px;width:min(260px,60vw);height:min(360px,56vh);position:relative}
#reelWrap{-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
#reel{position:absolute;inset:0;transform-style:preserve-3d}
.num{position:absolute;left:0;right:0;top:50%;height:80px;margin-top:-40px;display:flex;align-items:center;justify-content:center;
  font:800 64px "Be Vietnam Pro";color:rgba(255,255,255,.85);backface-visibility:hidden;
  text-shadow:0 0 18px rgba(155,123,255,.8)}
.num.win{color:var(--gold);text-shadow:0 0 30px var(--gold),0 0 60px var(--pink);animation:win 1s ease}
@keyframes win{40%{transform:var(--t) scale(1.5)}}
.frame{position:absolute;left:-14px;right:-14px;top:50%;height:96px;margin-top:-48px;border:2px solid rgba(255,210,122,.6);
  border-radius:20px;box-shadow:0 0 24px rgba(255,210,122,.35),inset 0 0 24px rgba(255,210,122,.15);z-index:4;pointer-events:none}
.label{margin-bottom:10px;letter-spacing:.3em;text-transform:uppercase;font-size:13px;opacity:.7}

/* Chữ lớn */
.big{font-family:"Dancing Script",cursive;line-height:1.15}
#date .big{font-family:"Be Vietnam Pro";font-weight:800;font-size:clamp(72px,24vw,180px);
  background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(255,210,122,.6))}
#wish .big{font-size:clamp(44px,12vw,96px);color:var(--pink);text-shadow:0 0 30px rgba(255,126,182,.7)}
#name .big{font-size:clamp(64px,19vw,150px);background:linear-gradient(90deg,var(--gold),var(--pink),var(--violet),var(--gold));
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;
  filter:drop-shadow(0 0 26px rgba(255,126,182,.6))}
@keyframes shine{to{background-position:300% 0}}
.scene.show .pop{animation:pop 1.2s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.3) translateZ(0);filter:blur(12px)}100%{opacity:1;transform:none}}
.letters .w{display:inline-block;white-space:nowrap}
.letters span span{display:inline-block;opacity:0;transform:translateY(40px) rotate(-8deg)}
.scene.show .letters span span{animation:rise .7s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.sub{margin-top:10px;font-weight:300;opacity:.75;letter-spacing:.2em;font-size:14px}

/* Cảnh nến */
#candleScene .hint{max-width:340px;font-weight:300;opacity:.85;line-height:1.5;min-height:3em}
.cake{position:relative;width:220px;height:300px;margin:10px 0 6px}
.candle{position:absolute;left:50%;bottom:110px;width:34px;height:130px;margin-left:-17px;border-radius:8px 8px 4px 4px;
  background:repeating-linear-gradient(135deg,#fff 0 12px,#ff9cc6 12px 24px);box-shadow:inset -6px 0 10px rgba(0,0,0,.15)}
.wick{position:absolute;left:50%;top:-14px;width:3px;height:16px;margin-left:-1.5px;background:#3a2a20;border-radius:2px}
.flameBox{position:absolute;left:50%;top:-96px;width:60px;height:90px;margin-left:-30px;cursor:pointer;transform-origin:50% 100%}
.flame{position:absolute;left:50%;bottom:6px;width:26px;height:58px;margin-left:-13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 75%,#fff 0 18%,#ffe27a 32%,#ff9a2e 60%,rgba(255,80,0,0) 75%);
  transform-origin:50% 100%;animation:flick .12s infinite alternate;filter:blur(.4px)}
.glow{position:absolute;left:50%;top:-140px;width:260px;height:260px;margin-left:-130px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,200,90,.45),rgba(255,140,40,.12) 40%,transparent 70%);transition:opacity .6s}
@keyframes flick{from{transform:scaleY(1) skewX(1deg)}to{transform:scaleY(1.06) skewX(-2deg)}}
.out .flame{opacity:0!important;transition:opacity .4s}
.out .glow{opacity:0}
.smoke{position:absolute;left:50%;bottom:20px;width:10px;height:10px;margin-left:-5px;border-radius:50%;
  background:rgba(220,220,230,.5);filter:blur(4px);opacity:0}
.out .smoke{animation:smoke 2.4s ease-out forwards}
.out .smoke:nth-child(2){animation-delay:.25s}.out .smoke:nth-child(3){animation-delay:.5s}
@keyframes smoke{0%{opacity:.8;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(14px,-120px) scale(6)}}
.tier{position:absolute;left:50%;border-radius:16px 16px 10px 10px}
.tier.t1{bottom:0;width:220px;height:70px;margin-left:-110px;background:linear-gradient(#ff8fbf,#e05a95)}
.tier.t2{bottom:62px;width:170px;height:56px;margin-left:-85px;background:linear-gradient(#fff2f8,#ffc7de)}
.tier::before{content:"";position:absolute;left:0;right:0;top:-2px;height:16px;border-radius:16px 16px 50% 50%/16px 16px 100% 100%;
  background:#fff;opacity:.9}
.plate{position:absolute;left:50%;bottom:-10px;width:260px;height:16px;margin-left:-130px;border-radius:50%;background:rgba(255,255,255,.25)}
.meter{width:200px;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px;opacity:0;transition:opacity .4s}
.meter.on{opacity:1}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pink));transition:width .08s}

/* Lá thư */
.envelope{position:relative;width:min(300px,78vw);aspect-ratio:3/2;cursor:pointer;margin-top:10px;
  animation:float 3s ease-in-out infinite;perspective:800px}
@keyframes float{50%{transform:translateY(-12px)}}
.env-back{position:absolute;inset:0;background:#e9a6c2;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.env-front{position:absolute;inset:0;border-radius:10px;z-index:3;pointer-events:none;
  background:linear-gradient(to top right,#f7c6da 50%,transparent 50.5%) left/50.5% 100% no-repeat,
             linear-gradient(to top left,#f4b9d1 50%,transparent 50.5%) right/50.5% 100% no-repeat,
             linear-gradient(to top,#f9d3e3 0 0) bottom/100% 0 no-repeat}
.env-front::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;border-radius:0 0 10px 10px;
  background:linear-gradient(#fbd9e7,#f6c3d8);clip-path:polygon(0 100%,50% 0,100% 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;transform-origin:50% 0;transition:transform .8s ease, z-index 0s .4s;
  background:linear-gradient(#ffb3cf,#f09abd);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0}
.seal{position:absolute;left:50%;top:52%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;z-index:5;
  background:radial-gradient(circle at 35% 35%,#ff6a9a,#c2185b);display:flex;align-items:center;justify-content:center;
  font-size:20px;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:opacity .4s}
.paper{position:absolute;left:6%;right:6%;top:8%;bottom:8%;background:#fffaf3;border-radius:6px;z-index:2;
  transition:transform 1s cubic-bezier(.3,1.2,.4,1) .5s;display:flex;align-items:center;justify-content:center;
  font-family:"Dancing Script";color:#c2185b;font-size:22px}
.envelope.open{animation:none}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}
.envelope.open .seal{opacity:0}
.envelope.open .paper{transform:translateY(-60%)}
.tapme{margin-top:22px;opacity:.8;font-weight:300;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}

#letter{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(5,3,15,.6);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .8s}
#letter.show{opacity:1;visibility:visible}
.card{width:min(520px,100%);max-height:86vh;overflow:auto;background:#fffaf3;color:#4a2a3a;border-radius:14px;
  padding:34px 26px 28px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:translateY(40px) scale(.95);transition:transform .9s cubic-bezier(.2,1.2,.4,1);
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(194,24,91,.08) 31px 32px);user-select:text;-webkit-user-select:text}
#letter.show .card{transform:none}
.card h2{font-family:"Dancing Script";font-size:38px;color:#c2185b;margin-bottom:14px}
.card p{line-height:32px;font-size:16px;margin-bottom:8px}
.card .sign{text-align:right;font-family:"Dancing Script";font-size:26px;color:#c2185b;margin-top:14px}
.card .again{display:block;margin:22px auto 0;padding:10px 22px;border-radius:999px;border:1px solid #e7a3c0;background:#fff0f6;
  color:#c2185b;font:600 14px "Be Vietnam Pro";cursor:pointer}
</style>
</head>
<body>
<canvas id="space"></canvas>
<canvas id="fx"></canvas>
<div id="flash"></div>

<section class="scene show" id="start">
  <div class="title">Có một món quà nhỏ…</div>
  <p>dành riêng cho bạn</p>
  <button class="btn" id="startBtn">Chạm để mở ✨</button>
</section>

<section class="scene" id="reelScene">
  <div class="label">Tháng 10 · ngày đặc biệt là…</div>
  <div id="reelWrap"><div id="reel"></div><div class="frame"></div></div>
</section>

<section class="scene" id="date"><div class="big pop">21/10</div><div class="sub">MỘT NGÀY THẬT ĐẶC BIỆT</div></section>
<section class="scene" id="wish"><div class="big letters" id="wishText"></div></section>
<section class="scene" id="name"><div class="big pop" id="nameText"></div><div class="sub">🎂 ✨ 💖</div></section>

<section class="scene" id="candleScene">
  <div class="hint" id="hint">Hãy nhắm mắt, ước một điều thật đẹp<br>rồi thổi tắt ngọn nến nhé 🕯️</div>
  <div class="cake" id="cake" style="cursor:pointer">
    <div class="plate"></div>
    <div class="tier t1"></div>
    <div class="tier t2"></div>
    <div class="candle">
      <div class="glow"></div>
      <div class="wick"></div>
      <div class="flameBox" id="flameBox">
        <div class="smoke"></div><div class="smoke"></div><div class="smoke"></div>
        <div class="flame" id="flame"></div>
      </div>
    </div>
  </div>
  <div class="tapme" id="tapHint">👆 Chạm vào nến để thổi</div>
</section>

<section class="scene" id="envScene">
  <div class="big" style="font-size:clamp(34px,9vw,56px);color:var(--gold);margin-bottom:22px">Điều ước đã được gửi đi 💫</div>
  <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="paper">Gửi Lan Uyên</div>
    <div class="env-front"></div>
    <div class="flap"></div>
    <div class="seal">💌</div>
  </div>
  <div class="tapme">Chạm vào lá thư để mở</div>
</section>

<div id="letter">
  <div class="card">
    <h2 id="letterTitle"></h2>
    <div id="letterBody"></div>
    <div class="sign" id="letterSign"></div>
    <button class="again" id="againBtn">Xem lại từ đầu ↺</button>
  </div>
</div>

<script>
/* ====== SỬA NỘI DUNG Ở ĐÂY ====== */
const CONFIG = {
  name: "Lan Uyên",
  day: 21,
  month: 10,
  wish: "Chúc mừng sinh nhật muộn",
  letterTitle: "Gửi Lan Uyên,",
  letter: [
    "Chúc mừng sinh nhật muộn nha bạn iu 🎂❤",
    "Xin lỗi vì lời chúc đến hơi trễ nhé 🥹 Muộn nhưng tình củm vẫn đong đầy =)))",
    "Tuổi mới chúc b thật nhiều sức khỏe, luôn vui vẻ, hạnh phúc và gặp thật nhiều may mắn. Mong rằng những điều b đang cố gắng sẽ sớm có kết quả, những dự định còn dang dở sẽ dần thành hiện thực vững bước trên con đường mình đã chọn và gặt hái được nhiều thành công nhé.",
    "Càng lớn mỗi đứa đều có một cuộc sống riêng, những công việc riêng, những áp lực và dự định riêng cần phải lo toan. Chẳng còn nhiều thời gian để gặp nhau, để ngồi kể đủ thứ chuyện trên đời như ngày trước. Có khi cả tháng chẳng nhắn cho nhau một tin, cũng chẳng biết dạo này đứa kia đang sống thế nào. Nhưng t mong rằng, dù sau này có bận rộn đến đâu, mỗi đứa có đi xa đến đâu thì cũng đừng vì thế mà dần mất liên lạc với nhau nhé.",
    "Happy belated birthday! 🥳🎉"
  ],
  sign: "— Hiếu"
};
/* ================================= */

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const show = id => { document.querySelectorAll('.scene').forEach(s => s.classList.toggle('show', s.id === id)); };

/* ---------- Không gian 3D (starfield có phối cảnh) ---------- */
const space = $('space'), sctx = space.getContext('2d');
const fx = $('fx'), fctx = fx.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize(){
  W = innerWidth; H = innerHeight;
  for (const c of [space, fx]) { c.width = W * DPR; c.height = H * DPR; }
  sctx.setTransform(DPR,0,0,DPR,0,0); fctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize); resize();

const STAR_N = 900, DEPTH = 1600;
const palette = ['#ffffff','#ffd27a','#ff9cc6','#b9a6ff','#9fdcff'];
const stars = Array.from({length: STAR_N}, () => newStar(true));
function newStar(rand){
  return { x:(Math.random()-.5)*2400, y:(Math.random()-.5)*2400, z: rand ? Math.random()*DEPTH : DEPTH,
           c: palette[Math.random()*palette.length|0], s: Math.random()*1.4+.4 };
}
// nebula
const nebulae = [
  {x:.25,y:.3,r:.55,c:'155,123,255'},{x:.8,y:.7,r:.6,c:'255,126,182'},{x:.6,y:.15,r:.4,c:'80,140,255'}
];
let speed = 1.2, targetSpeed = 1.2, rot = 0, mx = 0, my = 0;
addEventListener('pointermove', e => { mx = (e.clientX/W - .5); my = (e.clientY/H - .5); });
addEventListener('deviceorientation', e => { if (e.gamma!=null){ mx = e.gamma/90; my = (e.beta-45)/90; } });

function drawSpace(){
  speed += (targetSpeed - speed) * .05;
  rot += 0.0006 + speed*0.00005;
  sctx.fillStyle = 'rgba(5,3,15,' + (speed > 8 ? .25 : .9) + ')';
  sctx.fillRect(0,0,W,H);
  for (const n of nebulae){
    const g = sctx.createRadialGradient(n.x*W, n.y*H, 0, n.x*W, n.y*H, n.r*Math.max(W,H));
    g.addColorStop(0, `rgba(${n.c},.10)`); g.addColorStop(1, 'rgba(0,0,0,0)');
    sctx.fillStyle = g; sctx.fillRect(0,0,W,H);
  }
  const cx = W/2 + mx*40, cy = H/2 + my*40, f = Math.min(W,H)*.9;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  for (const s of stars){
    const pz = s.z;
    s.z -= speed;
    if (s.z < 1){ Object.assign(s, newStar(false)); continue; }
    const x = s.x*cr - s.y*sr, y = s.x*sr + s.y*cr;
    const px = cx + x/s.z*f, py = cy + y/s.z*f;
    if (px<-50||px>W+50||py<-50||py>H+50){ if (s.z < DEPTH*.5) Object.assign(s,newStar(false)); continue; }
    const size = s.s * (1 - s.z/DEPTH) * 2.6 + .2;
    const a = Math.min(1, (1 - s.z/DEPTH)*1.4);
    sctx.globalAlpha = a; sctx.strokeStyle = sctx.fillStyle = s.c;
    if (speed > 4){
      const ox = cx + x/pz*f, oy = cy + y/pz*f;
      sctx.lineWidth = size; sctx.beginPath(); sctx.moveTo(ox,oy); sctx.lineTo(px,py); sctx.stroke();
    } else { sctx.beginPath(); sctx.arc(px,py,size,0,6.283); sctx.fill(); }
  }
  sctx.globalAlpha = 1;
}

/* ---------- Pháo hoa + confetti ---------- */
const parts = [];
function firework(x, y, n = 90){
  const hue = Math.random()*360;
  for (let i=0;i<n;i++){
    const a = Math.random()*6.283, v = Math.random()*5+2;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:Math.random()*.012+.01,
      c:`hsl(${(hue+Math.random()*60)%360},100%,${60+Math.random()*20}%)`,r:Math.random()*2+1,type:'spark'});
  }
}
function confetti(n = 160){
  const cols = ['#ff7eb6','#ffd27a','#9b7bff','#7fe0ff','#ffffff','#ff9a5c'];
  for (let i=0;i<n;i++) parts.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2,vy:Math.random()*2+2,
    life:1,decay:.003,c:cols[i%cols.length],w:Math.random()*8+5,h:Math.random()*5+3,a:Math.random()*6,va:(Math.random()-.5)*.3,type:'conf'});
}
function celebrate(times = 6){
  for (let i=0;i<times;i++) setTimeout(()=>firework(W*(.15+Math.random()*.7), H*(.15+Math.random()*.45)), i*280);
  confetti();
}
function drawFx(){
  fctx.clearRect(0,0,W,H);
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if (p.type==='spark'){ p.vx *= .97; p.vy = p.vy*.97 + .06; }
    else { p.a += p.va; p.vx += Math.sin(p.y/40)*.05; }
    if (p.life <= 0 || p.y > H+30){ parts.splice(i,1); continue; }
    fctx.globalAlpha = Math.max(0,p.life);
    fctx.fillStyle = p.c;
    if (p.type==='spark'){ fctx.beginPath(); fctx.arc(p.x,p.y,p.r,0,6.283); fctx.fill(); }
    else { fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.a); fctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.a*1.3))); fctx.restore(); }
  }
  fctx.globalAlpha = 1;
}
(function loop(){ drawSpace(); drawFx(); requestAnimationFrame(loop); })();

/* ---------- Âm thanh nhỏ (WebAudio, không cần file) ---------- */
let actx;
function tone(freq, t0, dur, vol=.12, type='triangle'){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+.02); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  o.start(t0); o.stop(t0+dur+.05);
}
function happyBirthday(){
  if (!actx) return;
  const C=262,D=294,E=330,F=349,G=392,A=440,Bb=466,C2=523;
  const notes=[[G,.3],[G,.15],[A,.5],[G,.5],[C2,.5],[494,1],[G,.3],[G,.15],[A,.5],[G,.5],[587,.5],[C2,1],
               [G,.3],[G,.15],[784,.5],[659,.5],[C2,.5],[494,.5],[A,1],[698,.3],[698,.15],[659,.5],[C2,.5],[587,.5],[C2,1.2]];
  let t = actx.currentTime + .1;
  for (const [f,d] of notes){ tone(f,t,d*1.1,.09); t += d*.85; }
}

/* ---------- Cảnh 1: dãy số xoay ---------- */
const reel = $('reel'), N = 31, STEP = 360/N;
const R = Math.round(80 / (2*Math.tan(Math.PI/N)));
for (let i=1;i<=N;i++){
  const d = document.createElement('div');
  d.className = 'num'; d.textContent = String(i).padStart(2,'0');
  const t = `rotateX(${(i-1)*STEP}deg) translateZ(${R}px)`;
  d.style.transform = t; d.style.setProperty('--t', t);
  reel.appendChild(d);
}
reel.style.transform = `translateZ(${-R}px)`;
function spinReel(){
  return new Promise(res => {
    const target = 4*360 + (CONFIG.day-1)*STEP, dur = 3200, t0 = performance.now();
    (function frame(now){
      const p = Math.min(1, (now-t0)/dur), e = 1 - Math.pow(1-p, 4);
      const ang = target*e;
      reel.style.transform = `translateZ(${-R}px) rotateX(${-ang}deg)`;
            if (p < 1) requestAnimationFrame(frame); else res();
    })(t0);
  });
}

/* ---------- Chuyển cảnh ---------- */
function flash(){ const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
async function warp(ms = 1400){ targetSpeed = 40; await wait(ms); targetSpeed = 1.2; }

function splitLetters(el, text){
  el.innerHTML = ''; let i = 0;
  text.split(' ').forEach((word, wi)=>{
    if (wi) el.appendChild(document.createTextNode(' '));
    const w = document.createElement('span'); w.className = 'w';
    [...word].forEach(ch=>{ const s = document.createElement('span'); s.textContent = ch;
      s.style.animationDelay = (i++*0.06)+'s'; w.appendChild(s); });
    el.appendChild(w);
  });
}

async function run(){
  show('reelScene'); targetSpeed = 6;
  await wait(900);
  await spinReel();
  targetSpeed = 1.2;
  reel.children[CONFIG.day-1].classList.add('win');
  celebrate(5);
  await wait(1700);

  flash(); await wait(250);
  show('date'); celebrate(3);
  await wait(2600);

  splitLetters($('wishText'), CONFIG.wish);
  show('wish'); await wait(3200);

  $('nameText').textContent = CONFIG.name;
  show('name'); celebrate(7);
  await wait(3400);

  show(''); await warp(1600);
  flash(); await wait(200);
  show('candleScene');
}

/* ---------- Thổi nến (chạm để thổi) ---------- */
let blown = false;
function setFlame(level){ // 0..1 gió
  const f = $('flame');
  f.style.transform = `scaleY(${1 - level*.55}) skewX(${-level*28}deg) translateX(${level*6}px)`;
  f.style.opacity = 1 - level*.35;
}
function blowOut(){
  if (blown) return; blown = true;
  try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if (actx.state !== 'running') actx.resume(); } catch(e){}
  $('tapHint').style.visibility = 'hidden';
  // hoạt ảnh gió thổi: lửa nghiêng dần rồi tắt
  let t = 0;
  const gust = setInterval(()=>{ t += .12; setFlame(Math.min(1, t)); if (t >= 1){ clearInterval(gust);
    $('cake').classList.add('out');
    $('hint').innerHTML = 'Yayyy! 🎉 Điều ước sẽ thành sự thật!';
    celebrate(8); happyBirthday();
    setTimeout(async ()=>{ show(''); await warp(1200); show('envScene'); }, 3600);
  } }, 40);
}
$('cake').addEventListener('click', blowOut);

/* ---------- Lá thư ---------- */
$('envelope').addEventListener('click', ()=>{
  const env = $('envelope');
  if (env.classList.contains('open')) return;
  env.classList.add('open'); 
  $('letterTitle').textContent = CONFIG.letterTitle;
  $('letterBody').innerHTML = CONFIG.letter.map(p=>`<p>${p}</p>`).join('');
  $('letterSign').textContent = CONFIG.sign;
  setTimeout(()=>{ $('letter').classList.add('show'); confetti(80); }, 1600);
});
$('againBtn').addEventListener('click', ()=>{
  $('letter').classList.remove('show'); $('envelope').classList.remove('open');
  $('cake').classList.remove('out'); setFlame(0); blown = false;
  $('tapHint').style.visibility = '';
  $('hint').innerHTML = 'Hãy nhắm mắt, ước một điều thật đẹp<br>rồi thổi tắt ngọn nến nhé 🕯️';
  [...reel.children].forEach(c=>c.classList.remove('win'));
  reel.style.transform = `translateZ(${-R}px)`;
  run();
});

/* ---------- Bắt đầu ---------- */
$('startBtn').addEventListener('click', ()=>{
  try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  run();
});
</script>
